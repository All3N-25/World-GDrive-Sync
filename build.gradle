plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"world-gdrive-sync" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "world-gdrive-sync"
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:6.1.3")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		// Show which test failed and why even under -q, without digging through build/test-results.
		quiet { events "failed"; exceptionFormat "full" }
	}
}

// The Google OAuth client (see OAuthClient). Taken from the environment (CI secrets) or the
// gitignored .env that scripts/setup-google-oauth.sh writes, so it never lands in the repo.
// Without it the build still works, and the mod shows sign-in as unavailable.
def dotenv = providers.fileContents(layout.projectDirectory.file(".env")).asText.orElse("")
def oauthValue = { String key ->
	providers.environmentVariable(key).orElse(dotenv.map { text ->
		def line = text.readLines().reverse().find { it.startsWith("${key}=") }
		if (line == null) return ""
		def value = line.substring(key.length() + 1).trim()
		if (value.length() >= 2 && (value[0] == "'" || value[0] == '"') && value[-1] == value[0]) {
			value = value[1..-2].replace("'\\''", "'")
		}
		value
	})
}

def generateOAuthClient = tasks.register("generateOAuthClient") {
	def clientId = oauthValue("GDRIVE_CLIENT_ID")
	def clientSecret = oauthValue("GDRIVE_CLIENT_SECRET")
	def outDir = layout.buildDirectory.dir("generated/oauth")
	inputs.property("clientId", clientId)
	inputs.property("clientSecret", clientSecret)
	outputs.dir(outDir)
	doLast {
		def file = outDir.get().file("world-gdrive-sync/oauth-client.properties").asFile
		file.parentFile.mkdirs()
		def props = new Properties()
		props.setProperty("clientId", clientId.get())
		props.setProperty("clientSecret", clientSecret.get())
		file.withWriter("UTF-8") { props.store(it, null) }
	}
}
sourceSets.main.resources.srcDir(generateOAuthClient)

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	// Compile and test with JDK 25 whatever JDK runs Gradle (provisioned via foojay if missing)
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
